<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&OP Planning Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
        .card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .kpi-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(30, 41, 59, 0.8) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
        .btn-success {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }
    </style>
</head>
<body class="text-gray-100">
    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur-lg border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-600 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-white">S&OP Planning Application</h1>
                        <p class="text-sm text-slate-400">Phase 0/1 - Production Planning Tool</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="loadData()" class="btn-primary px-4 py-2 rounded-lg text-white font-medium">
                        Load Data
                    </button>
                    <button onclick="runPlanning()" class="btn-success px-4 py-2 rounded-lg text-white font-medium" id="runBtn" disabled>
                        ▶ Run Planning
                    </button>
                    <button class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-white font-medium" disabled>
                        Export
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Tabs -->
        <div class="flex gap-2 mb-6 bg-slate-800/50 p-1 rounded-xl">
            <button class="px-4 py-2 rounded-lg font-medium bg-blue-600 text-white"> Dashboard</button>
            <button class="px-4 py-2 rounded-lg font-medium text-slate-400"> Planning</button>
            <button class="px-4 py-2 rounded-lg font-medium text-slate-400"> Capacity</button>
            <button class="px-4 py-2 rounded-lg font-medium text-slate-400"> Inventory</button>
            <button class="px-4 py-2 rounded-lg font-medium text-slate-400"> Scenarios</button>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="kpi-card rounded-xl p-6">
                <p class="text-slate-400 text-sm mb-1">Capacity Utilization</p>
                <p class="text-3xl font-bold text-blue-400" id="kpi-capacity">—</p>
            </div>
            <div class="kpi-card rounded-xl p-6" style="border-color: rgba(34, 197, 94, 0.3);">
                <p class="text-slate-400 text-sm mb-1">Service Level</p>
                <p class="text-3xl font-bold text-green-400" id="kpi-service">—</p>
            </div>
            <div class="kpi-card rounded-xl p-6" style="border-color: rgba(234, 179, 8, 0.3);">
                <p class="text-slate-400 text-sm mb-1">Total Issues</p>
                <p class="text-3xl font-bold text-yellow-400" id="kpi-issues">—</p>
            </div>
            <div class="kpi-card rounded-xl p-6" style="border-color: rgba(239, 68, 68, 0.3);">
                <p class="text-slate-400 text-sm mb-1">Critical Issues</p>
                <p class="text-3xl font-bold text-red-400" id="kpi-critical">—</p>
            </div>
        </div>

        <!-- Placeholder content -->
        <div class="card rounded-xl p-6">
            <h3 class="text-lg font-semibold mb-4"> Issues & Alerts</h3>
            <div class="text-slate-400 text-center py-8">
                <p>Load data and run planning to see results</p>
                <p class="text-sm mt-2">Click "Load Data" to begin</p>
            </div>
        </div>
    </main>

    <!-- Status Bar -->
    <footer class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-lg border-t border-slate-700 py-2 px-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <span id="status" class="text-slate-400">Ready - Load data to begin</span>
            <span class="text-slate-500 text-sm">S&OP Planning v0.1 (WIP)</span>
        </div>
    </footer>

    <script>
        // TODO: Implement data loading
        function loadData() {
            document.getElementById('status').textContent = 'Loading data...';
            // TODO: Connect to calculation engine
            alert('Data loading not yet implemented.\nWill connect to Python backend.');
        }

        // TODO: Implement planning
        function runPlanning() {
            document.getElementById('status').textContent = 'Running calculations...';
            // TODO: Connect to calculation engine
            alert('Planning calculations not yet implemented.');
        }
    </script>
</body>
</html>
